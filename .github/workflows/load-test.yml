name: Threshold Discovery Load Test

on:
  workflow_dispatch:

jobs:
  bombardier-test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Bombardier
        run: |
          go install ://github.com
          sudo cp $(go env GOPATH)/bin/bombardier /usr/local/bin/

      - name: Test Baseline Load (100 Connections)
        run: |
          ulimit -n 65535
          echo "Testing normal high traffic..."
          bombardier -c 100 -d 15s https://thepravah.co.in

      - name: Test Elevated Load (500 Connections)
        run: |
          echo "Testing peak event traffic..."
          bombardier -c 500 -d 15s https://thepravah.co.in

      - name: Test Extreme Load (1000 Connections)
        run: |
          echo "Testing the edge of the rate limiter..."
          bombardier -c 1000 -d 15s https://thepravah.co.in
